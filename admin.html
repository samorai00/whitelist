<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>NYVELLA — Admin Dashboard</title>
    <script src="https://cdn.tailwindcss.com"></script>
    <script src="https://cdn.jsdelivr.net/npm/@supabase/supabase-js@2"></script>
    <link href="https://fonts.googleapis.com/css2?family=Plus+Jakarta+Sans:wght@400;600;700;800&display=swap" rel="stylesheet">
</head>
<body class="bg-gray-950 text-gray-100 min-h-screen p-6 font-sans">

    <div class="max-w-5xl mx-auto space-y-6">
        
        <!-- Header -->
        <div class="flex items-center justify-between border-b border-gray-800 pb-6">
            <div>
                <h1 class="text-2xl font-bold text-white flex items-center gap-2">🛡️ NYVELLA Admin Dashboard</h1>
                <p class="text-xs text-gray-400 mt-1">Standalone control panel connected via Supabase API</p>
            </div>
            <button onclick="fetchData()" class="px-4 py-2 bg-gray-800 hover:bg-gray-700 text-xs font-bold rounded-xl transition">
                🔄 Refresh Data
            </button>
        </div>

        <!-- Controls -->
        <div class="grid grid-cols-1 sm:grid-cols-2 gap-4">
            <!-- Whitelist Status Switch -->
            <div class="bg-gray-900 border border-gray-800 rounded-2xl p-5 flex items-center justify-between">
                <div>
                    <div class="text-xs text-gray-400 uppercase font-bold">Whitelist Gate</div>
                    <div id="statusText" class="text-sm font-bold text-emerald-400 mt-1">LOADING...</div>
                </div>
                <label class="relative inline-flex items-center cursor-pointer">
                    <input type="checkbox" id="statusToggle" class="sr-only peer" onchange="toggleWhitelist(this.checked)">
                    <div class="w-11 h-6 bg-gray-800 peer-focus:outline-none rounded-full peer peer-checked:after:translate-x-full peer-checked:after:border-white after:content-[''] after:absolute after:top-[2px] after:left-[2px] after:bg-white after:border-gray-300 after:border after:rounded-full after:h-5 after:w-5 after:transition-all peer-checked:bg-emerald-500"></div>
                </label>
            </div>

            <!-- Stats & Export -->
            <div class="bg-gray-900 border border-gray-800 rounded-2xl p-5 flex items-center justify-between">
                <div>
                    <div class="text-xs text-gray-400 uppercase font-bold">Total Applicants</div>
                    <div id="totalCount" class="text-3xl font-black text-white mt-0.5">0</div>
                </div>
                <button onclick="exportCSV()" class="px-4 py-2.5 bg-emerald-500 hover:bg-emerald-400 text-black font-bold rounded-xl text-xs transition">
                    📥 Export CSV
                </button>
            </div>
        </div>

        <!-- Table -->
        <div class="bg-gray-900 border border-gray-800 rounded-2xl overflow-hidden">
            <table class="w-full text-left text-xs">
                <thead class="bg-gray-950 border-b border-gray-800 text-gray-400 uppercase">
                    <tr>
                        <th class="p-4">#</th>
                        <th class="p-4">Social Handle</th>
                        <th class="p-4">Wallet Address</th>
                        <th class="p-4">Date Submitted</th>
                    </tr>
                </thead>
                <tbody id="tableBody" class="divide-y divide-gray-800/60 font-mono text-gray-300">
                    <!-- Dynamic Data -->
                </tbody>
            </table>
        </div>
    </div>

    <script>
        const SUPABASE_URL = "https://YOUR_SUPABASE_PROJECT_ID.supabase.co";
        const SUPABASE_ANON_KEY = "YOUR_SUPABASE_ANON_KEY";
        const supabase = window.supabase.createClient(SUPABASE_URL, SUPABASE_ANON_KEY);

        let applications = [];

        document.addEventListener('DOMContentLoaded', () => {
            fetchStatus();
            fetchData();
        });

        async function fetchStatus() {
            const { data } = await supabase.from('settings').select('is_open').eq('id', 'whitelist_status').single();
            if (data) {
                document.getElementById('statusToggle').checked = data.is_open;
                updateStatusLabel(data.is_open);
            }
        }

        async function toggleWhitelist(isOpen) {
            updateStatusLabel(isOpen);
            await supabase.from('settings').update({ is_open: isOpen }).eq('id', 'whitelist_status');
        }

        function updateStatusLabel(isOpen) {
            const txt = document.getElementById('statusText');
            if (isOpen) {
                txt.innerText = "OPEN FOR APPLICATIONS";
                txt.className = "text-sm font-bold text-emerald-400 mt-1";
            } else {
                txt.innerText = "APPLICATIONS CLOSED";
                txt.className = "text-sm font-bold text-red-400 mt-1";
            }
        }

        async function fetchData() {
            const { data, error } = await supabase.from('whitelist').select('*').order('created_at', { ascending: false });
            if (data) {
                applications = data;
                document.getElementById('totalCount').innerText = data.length;
                renderTable(data);
            }
        }

        function renderTable(data) {
            const tbody = document.getElementById('tableBody');
            if (data.length === 0) {
                tbody.innerHTML = `<tr><td colspan="4" class="p-6 text-center text-gray-500">No submissions found.</td></tr>`;
                return;
            }
            tbody.innerHTML = data.map((item, index) => `
                <tr class="hover:bg-gray-950/40">
                    <td class="p-4 text-gray-500">${data.length - index}</td>
                    <td class="p-4 font-bold text-white font-sans">${item.handle}</td>
                    <td class="p-4 text-emerald-400">${item.wallet}</td>
                    <td class="p-4 text-gray-500 text-[11px]">${new Date(item.created_at).toLocaleString()}</td>
                </tr>
            `).join('');
        }

        function exportCSV() {
            if (applications.length === 0) return alert("No data");
            let csv = "Handle,Wallet,Timestamp\n";
            applications.forEach(a => {
                csv += `"${a.handle}","${a.wallet}","${a.created_at}"\n`;
            });
            const blob = new Blob([csv], { type: 'text/csv' });
            const url = window.URL.createObjectURL(blob);
            const a = document.createElement('a');
            a.href = url;
            a.download = 'whitelist_entries.csv';
            a.click();
        }
    </script>
</body>
</html>
